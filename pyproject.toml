[project]
name = "radon"
version = "0.1.0"
description = "Risk Analysis & Detection Orchestration Node - a self-hosted GCP cloud security posture scanner with local-LLM triage"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "pydantic>=2.0",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["radon*", "gcp_emulator*"]

[tool.pytest.ini_options]
testpaths = ["test-suite"]
addopts = "-q"

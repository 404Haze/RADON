[project]
name = "radon"
version = "0.1.0"
description = "Risk Analysis & Detection Orchestration Node - a self-hosted GCP cloud security posture scanner with local-LLM triage"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "pydantic>=2.0",
]

[project.optional-dependencies]
live = [
    "google-cloud-iam",
    "google-cloud-storage",
    "google-cloud-compute",
    "google-cloud-run",
]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["radon*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

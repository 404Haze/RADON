<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>R.A.D.O.N. — Cloud Security Posture</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-text">
          <span class="brand-name">R.A.D.O.N.</span>
          <span class="brand-sub">Cloud Security</span>
        </div>
      </div>
      <nav class="nav">
        <button class="nav-item active" data-tab="overview">Dashboard</button>
        <button class="nav-item" data-tab="findings">Findings</button>
        <button class="nav-item" data-tab="chat">AI Chat</button>
        <button class="nav-item" data-tab="trends">Trends</button>
        <button class="nav-item" data-tab="scan">Scan</button>
        <button class="nav-item" data-tab="settings">Settings</button>
      </nav>
    </aside>

    <main class="content">
      <section class="tab active" id="tab-overview"></section>
      <section class="tab" id="tab-findings" hidden></section>
      <section class="tab" id="tab-chat" hidden></section>
      <section class="tab" id="tab-trends" hidden></section>
      <section class="tab" id="tab-scan" hidden></section>
      <section class="tab" id="tab-settings" hidden></section>
    </main>
  </div>

  <footer class="footer">
    <span class="footer-brand">Metal Origami</span>
    <span class="dot">·</span>
    <span>Apache License 2.0</span>
    <span class="dot">·</span>
    <span>© 2026</span>
  </footer>

  <script src="/chart.umd.js"></script>
  <script src="/app.js"></script>
</body>
</html>
